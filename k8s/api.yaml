apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-config
  namespace: platform-demo
data:
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-platform-api-minikube
  namespace: platform-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-platform-api-minikube
  template:
    metadata:
      labels:
        app: k8s-platform-api-minikube
    spec:
      containers:
        - name: k8s-platform-api-minikube
          image: k8s-platform-api-minikube:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-api-config
          env:
            - name: DATABASE_URL
              value: postgres://platform:platform@postgres:5432/platform?sslmode=disable
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-platform-svc-minikube
  namespace: platform-demo
spec:
  selector:
    app: k8s-platform-api-minikube
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
